spring:
  application:
    name: badminton-api
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/badminton_ecommerce?connectionTimeZone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      # UTC LocalDateTime values must reach MySQL DATETIME without JVM timezone conversion.
      hibernate.type.java_time_use_direct_jdbc: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: ${CHATBOT_CONTEXT_TTL:30m}
      cookie:
        http-only: true
        secure: ${SERVER_SESSION_COOKIE_SECURE:false}
        same-site: ${SERVER_SESSION_COOKIE_SAME_SITE:Lax}
  error:
    include-message: never
    include-stacktrace: never
app:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-20b}
  payments:
    sandbox: ${PAYMENT_SANDBOX:true}
    web-url: ${PAYMENT_WEB_URL:http://localhost:5173}
    public-api-url: ${PAYMENT_PUBLIC_API_URL:}
    bank:
      enabled: ${PAYMENT_BANK_ENABLED:false}
      id: ${PAYMENT_BANK_ID:}
      name: ${PAYMENT_BANK_NAME:}
      account-number: ${PAYMENT_BANK_ACCOUNT_NUMBER:}
      account-name: ${PAYMENT_BANK_ACCOUNT_NAME:}
    sepay:
      enabled: ${SEPAY_WEBHOOK_ENABLED:false}
      webhook-secret: ${SEPAY_WEBHOOK_SECRET:}
    vnpay:
      enabled: ${VNPAY_ENABLED:false}
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
    momo:
      enabled: ${MOMO_ENABLED:false}
      partner-code: ${MOMO_PARTNER_CODE:}
      access-key: ${MOMO_ACCESS_KEY:}
      secret-key: ${MOMO_SECRET_KEY:}
    zalopay:
      enabled: ${ZALOPAY_ENABLED:false}
      app-id: ${ZALOPAY_APP_ID:}
      key1: ${ZALOPAY_KEY1:}
      key2: ${ZALOPAY_KEY2:}
  jwt:
    secret: ${JWT_SECRET}
    issuer: dh-badminton-store
    ttl-seconds: ${JWT_TTL_SECONDS:604800}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://ngdhiep-fithau.id.vn}
  scheduling:
    enabled: ${APP_SCHEDULING_ENABLED:true}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
