<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DH Badminton Store</title>
    <script>
      const path = window.location.pathname;
      const segments = path.split("/").filter(Boolean);
      const base = window.location.hostname.endsWith("github.io") && segments.length
        ? `/${segments[0]}/`
        : "/";
      const route = path.startsWith(base) ? path.slice(base.length) : path.slice(1);
      const redirect = `${route}${window.location.search}${window.location.hash}`;
      window.location.replace(`${base}?redirect=${encodeURIComponent(redirect)}`);
    </script>
  </head>
  <body></body>
</html>
